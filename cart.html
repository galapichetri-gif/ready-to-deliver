<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ready to Deliver - Cart</title><style>
body{
font-family:Arial,sans-serif;
margin:0;
background:#f4fff4;
}

header{
background:#1fa34a;
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.cart-item{
background:white;
padding:15px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
display:flex;
justify-content:space-between;
align-items:center;
}

.remove-btn{
background:red;
color:white;
border:none;
padding:8px 12px;
border-radius:5px;
cursor:pointer;
}

.total{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
margin-top:20px;
}

.btn{
display:inline-block;
background:#1fa34a;
color:white;
padding:12px 20px;
text-decoration:none;
border-radius:5px;
margin-top:10px;
}

footer{
background:#222;
color:white;
text-align:center;
padding:15px;
margin-top:30px;
}
</style></head>
<body><header>
<h1>Shopping Cart</h1>
<p>Ready to Deliver</p>
</header><div class="container"><div id="cartItems"></div><div class="total">
<h2 id="totalPrice">Total: ₹0</h2><a href="checkout.html" class="btn">
Proceed to Checkout
</a>
</div></div><footer>
© 2026 Ready to Deliver
</footer><script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function renderCart(){

let cartItems = document.getElementById("cartItems");
let total = 0;

cartItems.innerHTML = "";

cart.forEach((item,index)=>{

total += item.price;

cartItems.innerHTML += `
<div class="cart-item">
<span>${item.name} - ₹${item.price}</span>

<button class="remove-btn"
onclick="removeItem(${index})">
Remove
</button>
</div>
`;

});

document.getElementById("totalPrice").innerText =
"Total: ₹" + total;
}

function removeItem(index){

cart.splice(index,1);

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

renderCart();
}

renderCart();
</script></body>
</html>
