<script>
function generateInvoice(){

const { jsPDF } = window.jspdf;
const doc = new jsPDF();

let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;
let items = document.getElementById("items").value;
let total = document.getElementById("total").value;

let invoiceNo = "RTD" + Date.now();
let date = new Date().toLocaleDateString();

doc.setFontSize(20);
doc.text("READY TO DELIVER", 20, 20);

doc.setFontSize(11);
doc.text("Tihu • Makhibaha • Haribhanga", 20, 30);

doc.line(20,35,190,35);

doc.text("Invoice No: " + invoiceNo, 20, 45);
doc.text("Date: " + date, 140, 45);

doc.text("Customer Name: " + name, 20, 60);
doc.text("Phone: " + phone, 20, 70);

doc.text("Items Ordered:", 20, 90);

let splitItems = doc.splitTextToSize(items, 160);
doc.text(splitItems, 20, 100);

doc.setFontSize(14);
doc.text("Total Amount: ₹" + total, 20, 140);

doc.setFontSize(12);
doc.text("Payment Status: Pending", 20, 160);

doc.text("Thank you for shopping with Ready to Deliver!", 20, 180);

doc.save("ReadyToDeliver-Invoice.pdf");

document.getElementById("preview").style.display="block";
}
</script>
