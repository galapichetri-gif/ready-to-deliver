<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - Ready to Deliver</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4fff4;
margin:0;
}

header{
background:#1fa34a;
color:white;
text-align:center;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
padding:20px;
}

input, textarea, select{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
box-sizing:border-box;
}

.btn{
background:#1fa34a;
color:white;
border:none;
padding:12px;
width:100%;
border-radius:5px;
font-size:16px;
cursor:pointer;
}

.order-box{
background:white;
padding:20px;
border-radius:10px;
margin-bottom:20px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}
</style>
</head>
<body>

<header>
<h1>Checkout</h1>
</header>

<div class="container">

<div class="order-box">
<h2>Your Order</h2>
<div id="orderItems"></div>
<h3 id="totalPrice"></h3>
</div>

<input type="text" id="name" placeholder="Full Name" required>

<input type="tel" id="phone" placeholder="Mobile Number" required>

<textarea id="address" placeholder="Delivery Address"></textarea>

<select id="payment">
<option>Cash on Delivery</option>
<option>UPI Payment</option>
</select>

<button class="btn" onclick="placeOrder()">
Place Order on WhatsApp
</button>

</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let total = 0;
let itemsText = "";

cart.forEach(item=>{
itemsText += item.name + " - ₹" + item.price + "<br>";
total += item.price;
});

document.getElementById("orderItems").innerHTML = itemsText;
document.getElementById("totalPrice").innerHTML =
"Total: ₹" + total;

function placeOrder(){

let name =
document.getElementById("name").value;

let phone =
document.getElementById("phone").value;

let address =
document.getElementById("address").value;

let payment =
document.getElementById("payment").value;

let message =
`New Order

Name: ${name}
Phone: ${phone}

Address:
${address}

Payment:
${payment}

Items:
${cart.map(item=>item.name + " - ₹" + item.price).join("\n")}

Total: ₹${total}`;

let url =
"https://wa.me/918638890291?text="
+ encodeURIComponent(message);

window.open(url,"_blank");
}
</script>

</body>
</html>
